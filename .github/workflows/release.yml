name: Build & Release (Windows + Linux)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build MSI (Windows)
        if: matrix.os == 'windows-latest'
        run: ./gradlew :composeApp:packageMsi

      - name: Build Portable EXE (Windows)
        if: matrix.os == 'windows-latest'
        run: ./gradlew :composeApp:packageExe

      - name: Zip Portable EXE (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir portable
          copy composeApp\build\compose\binaries\main\exe\*.exe portable\
          powershell Compress-Archive portable Osync-Portable-Windows.zip

      - name: Build Linux App
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :composeApp:packageAppImage

      - name: Tar Linux build (Arch compatible)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir linux-portable
          cp composeApp/build/compose/binaries/main/appimage/*.AppImage linux-portable/
          tar -czvf Osync-Portable-Linux.tar.gz linux-portable

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Osync-Build-${{ matrix.os }}
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            Osync-Portable-Windows.zip
            Osync-Portable-Linux.tar.gz
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
            Osync-Portable-Windows.zip
            Osync-Portable-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}