name: Build Desktop Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Windows (MSI + Portable ZIP)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Windows Apps
        run: ./gradlew :composeApp:packageMsi :composeApp:createDistributable

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path composeApp/build/compose/binaries/main/app/Osync -DestinationPath Osync-Portable.zip

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: Osync-Windows-Installer
          path: composeApp/build/compose/binaries/main/msi/*.msi

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: Osync-Windows-Portable
          path: Osync-Portable.zip

  # Linux (AppImage)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file wget

      - name: Build Linux AppImage
        run: |
          chmod +x create_appimage.sh
          ./create_appimage.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Osync-Linux-AppImage
          path: Osync.AppImage